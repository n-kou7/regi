:root{font-family:system-ui,-apple-system,sans-serif;color:#263b49;background:#e9f3fa}*{box-sizing:border-box}body{margin:0;overscroll-behavior:none}main{height:100dvh;min-height:460px;display:grid;grid-template-rows:auto 1fr auto;gap:10px;padding:12px 18px}header{display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-size:clamp(18px,2.8vw,30px);margin:0}.topbtn{border:0;background:white;border-radius:14px;padding:10px 16px;font-weight:800;font-size:16px}.workspace{display:grid;grid-template-columns: minmax(210px,36%) 1fr;gap:12px;min-height:0}.display{background:#183d51;color:white;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:0 5px 0 #102e3d}.display small{font-size:clamp(17px,2vw,24px)}#price{font-size:clamp(50px,7.5vw,100px);font-weight:900;line-height:1.1;white-space:nowrap}.traybox{background:#d6e4ed;border-radius:24px;padding:12px;display:flex;flex-direction:column;min-height:0}.trayhead{display:flex;justify-content:space-between;align-items:center;font-weight:900;gap:10px}.tray{margin-top:8px;flex:1;border:4px dashed #92b0c0;background:#f7fbfe;border-radius:18px;position:relative;min-height:110px;overflow:hidden;touch-action:none}.placeholder{position:absolute;inset:0;display:grid;place-items:center;color:#839caa;font-size:clamp(16px,2vw,24px);font-weight:800;pointer-events:none}.tray:has(.placed) .placeholder{display:none}.bottom{background:white;border-radius:22px;padding:10px 14px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.coins{display:flex;justify-content:space-around;align-items:center;gap:6px}.coin{border-radius:50%;border:4px solid #fff8;box-shadow:inset 0 0 0 3px #0002,0 4px 0 #0002;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;user-select:none;-webkit-user-select:none;touch-action:none;cursor:grab;color:#34414a;width:clamp(55px,8vw,90px);height:clamp(55px,8vw,90px);font-size:clamp(21px,3vw,33px);flex-shrink:0}.coin span{font-size:12px}.coin[data-value="1"]{background:#dbe3ed}.coin[data-value="5"]{background:#f4c969}.coin[data-value="10"]{background:#d99568}.coin[data-value="50"]{background:#f6d57b}.coin[data-value="100"]{background:#b6dbe5}.coin[data-value="500"]{background:#c9b9ed}.coin.placed{position:absolute;width:clamp(48px,6vw,76px);height:clamp(48px,6vw,76px);font-size:clamp(18px,2.3vw,27px);cursor:pointer}.actions{display:flex;gap:8px;align-items:center}.action{border:0;border-radius:16px;padding:16px 20px;font-size:clamp(16px,2vw,23px);font-weight:900;white-space:nowrap}.check{background:#1f996f;color:white}.clear{background:#e5edf1;color:#3c596b}.ghost{position:fixed;z-index:1000;pointer-events:none;opacity:.86;transform:translate(-50%,-50%) scale(1.12)}#modal{position:fixed;inset:0;background:#102d3d99;display:none;align-items:center;justify-content:center;z-index:2000;padding:20px}#modal.show{display:flex}.dialog{background:white;border-radius:30px;padding:32px;max-width:520px;width:100%;text-align:center;box-shadow:0 20px 50px #0003}.dialog h2{font-size:clamp(30px,5vw,54px);margin:8px 0;color:#168961}.dialog p{font-size:24px;font-weight:800}.dialog button{background:#1f996f;color:white;border:0;border-radius:16px;padding:15px 30px;font-size:23px;font-weight:900}.hint{font-size:13px;color:#637c8d}@media (orientation:portrait){main{min-height:700px}.workspace{grid-template-columns:1fr;grid-template-rows:190px 1fr}.bottom{grid-template-columns:1fr}.actions{justify-content:center}.coin{width:clamp(45px,13vw,80px);height:clamp(45px,13vw,80px)}}@media(max-height:560px) and (orientation:landscape){main{gap:6px;padding:7px 12px}.traybox{padding:8px}.bottom{padding:6px 10px}.action{padding:10px 15px}.coin{width:clamp(48px,7vw,70px);height:clamp(48px,7vw,70px)}}
#price{cursor:pointer;border-bottom:3px dashed #9ee4ca;padding-bottom:4px}#price:active{opacity:.7}.display small:last-child{font-size:clamp(13px,1.5vw,18px)}.coins{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));justify-items:center;gap:4px}.coin{width:clamp(43px,5.6vw,74px);height:clamp(43px,5.6vw,74px);font-size:clamp(16px,2.2vw,26px)}.coin span{font-size:11px}.coin.bill{border-radius:9px;width:clamp(62px,7.7vw,102px);height:clamp(40px,5vw,64px);font-size:clamp(13px,1.65vw,22px);border:3px double #ffffffbb;box-shadow:inset 0 0 0 2px #0002,0 3px 0 #0002}.coin[data-value="1000"]{background:#b4dfd1}.coin[data-value="5000"]{background:#dfc1e7}.coin[data-value="10000"]{background:#e8ce99}.coin.placed.bill{width:90px;height:52px;font-size:18px;border-radius:8px}.amount-overlay{position:fixed;inset:0;background:#102d3daa;z-index:2100;display:none;align-items:center;justify-content:center;padding:16px}.amount-overlay.show{display:flex}.amount-card{width:min(520px,100%);background:white;border-radius:24px;padding:26px;display:flex;flex-direction:column;gap:15px;box-shadow:0 16px 45px #0004}.amount-card h2{margin:0;font-size:26px}.amount-card label{font-weight:800}.amount-line{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:800}.amount-line input{width:100%;min-width:0;padding:10px;font-size:32px;font-weight:800;border:2px solid #8db4c7;border-radius:12px}.amount-buttons{display:flex;gap:10px;justify-content:flex-end}.amount-buttons button{border:0;border-radius:12px;padding:12px;font-size:16px;font-weight:800;background:#e5edf1}.amount-buttons button[type=submit]{background:#1f996f;color:white}@media(max-width:900px){.bottom{grid-template-columns:1fr}.coins{grid-template-columns:repeat(9,minmax(0,1fr))}.coin.bill{width:clamp(55px,8vw,90px)}.actions{justify-content:center}}@media(orientation:portrait){.coins{grid-template-columns:repeat(5,1fr)}.bottom{grid-template-columns:1fr}.coin.bill{width:76px}}@media(max-height:560px) and (orientation:landscape){.bottom{grid-template-columns:1fr auto}.coins{gap:2px}.coin{width:clamp(37px,4.8vw,62px);height:clamp(37px,4.8vw,62px);font-size:18px}.coin.bill{width:clamp(52px,7vw,90px);height:42px;font-size:15px}.coin.placed.bill{width:76px;height:44px;font-size:15px}.bottom{gap:5px}.action{padding:9px 10px;font-size:15px}}

html,body{width:100%;height:100%;overflow:hidden;touch-action:manipulation;-webkit-text-size-adjust:100%}button,.coin,#price{touch-action:manipulation;-webkit-tap-highlight-color:transparent} .coin{touch-action:none} .tray{overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;touch-action:pan-y;display:block;padding:8px} .tray .placeholder{position:absolute} .money-groups{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-content:start;min-height:100%}.money-group{min-width:0;border-radius:12px;background:#e8f2f8;border:1px solid #c7dce8;padding:6px;display:flex;flex-direction:column;gap:5px}.group-title{font-size:clamp(12px,1.35vw,17px);font-weight:900;color:#3b6478;display:flex;justify-content:space-between;align-items:center}.group-items{display:flex;flex-wrap:wrap;gap:5px;align-content:start}.tray .coin.placed{position:static!important;left:auto!important;top:auto!important;width:clamp(35px,4.2vw,56px);height:clamp(35px,4.2vw,56px);font-size:clamp(12px,1.55vw,19px);flex-shrink:0;cursor:pointer}.tray .coin.placed span{font-size:9px}.tray .coin.placed.bill{width:clamp(60px,6.7vw,86px);height:clamp(35px,3.9vw,47px);font-size:clamp(11px,1.4vw,16px)}.tray:has(.money-group) .placeholder{display:none}.tray .coin.placed:active{filter:brightness(.9)}@media(max-width:700px){.money-groups{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-height:560px) and (orientation:landscape){.tray{padding:5px}.money-groups{gap:5px}.money-group{padding:4px;gap:2px}.group-items{gap:3px}.tray .coin.placed{width:35px;height:35px;font-size:12px}.tray .coin.placed.bill{width:61px;height:35px;font-size:11px}}
</style></head><body><main><header><h1>🛒 おかいもの レジれんしゅう</h1><button class="topbtn" id="next">🔄 あたらしい もんだい</button></header><section class="workspace"><div class="display"><small>おかいけい</small><div id="price">378円</div><small>👆 きんがくを タップして かえられるよ</small></div><div class="traybox"><div class="trayhead"><span>🧺 レジの うけざら</span><span>いれた おかね：<strong id="total">0円</strong></span></div><div class="tray" id="tray"><div class="placeholder">ここに おかねを ドラッグ！</div><div class="money-groups" id="moneyGroups"></div></div></div></section><section class="bottom"><div class="coins" id="coins"></div><div class="actions"><button class="action clear" id="clear">もどす ↩</button><button class="action check" id="check">おかいけい ✓</button></div></section></main><div id="amountDialog" class="amount-overlay"><form id="amountForm" class="amount-card"><h2>💰 おかいけいを きめよう</h2><label for="amountInput">いくらにする？（1〜99,999円）</label><div class="amount-line"><input id="amountInput" type="number" inputmode="numeric" min="1" max="99999" required><span>円</span></div><div class="amount-buttons"><button type="button" id="amountCancel">やめる</button><button type="submit">この きんがくにする ✓</button></div></form></div><div id="modal"><div class="dialog"><h2 id="resultTitle"></h2><p id="resultText"></p><button id="modalButton">つぎの もんだい ▶</button></div></div><script>
const denominations=[1,5,10,50,100,500,1000,5000,10000],coins=document.querySelector('#coins'),tray=document.querySelector('#tray'),groups=document.querySelector('#moneyGroups'),totalEl=document.querySelector('#total'),priceEl=document.querySelector('#price'),modal=document.querySelector('#modal');let price=378,total=0,placed=[],drag=null,serial=0;
function coin(v,placedCoin=false){const e=document.createElement('div');e.className='coin'+(v>=1000?' bill':'')+(placedCoin?' placed':'');e.dataset.value=v;e.innerHTML=`${v.toLocaleString('ja-JP')}<span>円</span>`;return e}
denominations.forEach(v=>{let e=coin(v);coins.appendChild(e);e.addEventListener('pointerdown',ev=>startDrag(ev,v,e))});
function update(){total=placed.reduce((s,x)=>s+x.v,0);totalEl.textContent=total.toLocaleString('ja-JP')+'円';renderGroups()}
function renderGroups(){groups.replaceChildren();for(const v of denominations){const items=placed.filter(x=>x.v===v);if(!items.length)continue;const group=document.createElement('div');group.className='money-group';const title=document.createElement('div');title.className='group-title';title.innerHTML=`<span>${v.toLocaleString('ja-JP')}円</span><span>× ${items.length}</span>`;const body=document.createElement('div');body.className='group-items';for(const item of items){const e=coin(v,true);e.dataset.id=item.id;e.title='タップして1枚もどす';e.addEventListener('pointerdown',ev=>{ev.stopPropagation();startDrag(ev,v,e,item.id)});body.appendChild(e)}group.append(title,body);groups.appendChild(group)}}
function add(v){placed.push({v,id:++serial});update()}
function remove(id){placed=placed.filter(x=>x.id!==id);update()}
function startDrag(ev,v,source,id=null){if(ev.button!==0)return;ev.preventDefault();const g=coin(v);g.classList.add('ghost');document.body.appendChild(g);drag={v,g,id,startX:ev.clientX,startY:ev.clientY,pointerId:ev.pointerId};moveDrag(ev);try{source.setPointerCapture(ev.pointerId)}catch(e){}}
function moveDrag(ev){if(!drag||ev.pointerId!==drag.pointerId)return;drag.g.style.left=ev.clientX+'px';drag.g.style.top=ev.clientY+'px'}
function endDrag(ev){if(!drag||ev.pointerId!==drag.pointerId)return;const {v,g,id,startX,startY}=drag;g.remove();drag=null;const r=tray.getBoundingClientRect(),inside=ev.clientX>=r.left&&ev.clientX<=r.right&&ev.clientY>=r.top&&ev.clientY<=r.bottom,moved=Math.hypot(ev.clientX-startX,ev.clientY-startY)>12;if(id!==null){if(!moved||!inside)remove(id)}else if(inside||!moved)add(v)}
document.addEventListener('pointermove',moveDrag);document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',()=>{drag?.g.remove();drag=null});
document.addEventListener('dblclick',ev=>ev.preventDefault());document.addEventListener('gesturestart',ev=>ev.preventDefault(),{passive:false});document.addEventListener('gesturechange',ev=>ev.preventDefault(),{passive:false});
function reset(){placed=[];update()}function newQuestion(){reset();price=Math.floor(Math.random()*999)+1;priceEl.textContent=price.toLocaleString('ja-JP')+'円';modal.classList.remove('show')}priceEl.addEventListener('click',()=>{document.querySelector('#amountInput').value=String(price);document.querySelector('#amountDialog').classList.add('show');document.querySelector('#amountInput').focus()});document.querySelector('#amountCancel').onclick=()=>document.querySelector('#amountDialog').classList.remove('show');document.querySelector('#amountForm').onsubmit=ev=>{ev.preventDefault();const n=Number(document.querySelector('#amountInput').value);if(!Number.isInteger(n)||n<1||n>99999){alert('1〜99,999円の数字を入れてね');return}price=n;priceEl.textContent=n.toLocaleString('ja-JP')+'円';reset();modal.classList.remove('show');document.querySelector('#amountDialog').classList.remove('show')};document.querySelector('#clear').onclick=reset;document.querySelector('#next').onclick=newQuestion;document.querySelector('#check').onclick=()=>{let good=total===price;document.querySelector('#resultTitle').textContent=good?'🎉 せいかい！':'😊 おしい！';document.querySelector('#resultText').textContent=good?'ありがとうございました！':total<price?'あと '+(price-total)+'円 たりないよ':' '+(total-price)+'円 おおいよ';document.querySelector('#modalButton').textContent=good?'つぎの もんだい ▶':'もういちど ▶';modal.dataset.correct=good?'1':'0';modal.classList.add('show')};document.querySelector('#modalButton').onclick=()=>{if(modal.dataset.correct==='1')newQuestion();else modal.classList.remove('show')};newQuestion();
</script></body></html>
